<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Прогулка под дождем</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instructions">Нажмите на экран для начала игры<br>W, A, S, D — ходьба | SHIFT — бег | Мышь — осмотр</div>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, rainMesh;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        
        let walkTimer = 0;
        const cameraOriginalY = 1.7;

        let yawObject, pitchObject;
        const trees = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c1017);
            scene.fog = new THREE.FogExp2(0x0c1017, 0.035);

            yawObject = new THREE.Object3D(); 
            pitchObject = new THREE.Object3D(); 
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = cameraOriginalY;
            
            yawObject.add(pitchObject);
            pitchObject.add(camera);
            scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x1a2332, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x4a6fa5, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Земля без текстуры (просто темный цвет парка)
            const floorGeometry = new THREE.PlaneGeometry(300, 300, 64, 64);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x141f16,
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            createParkEnvironment();
            createRain();
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createParkEnvironment() {
            const pathGeo = new THREE.PlaneGeometry(6, 300);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.9 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.y = 0.01;
            path.receiveShadow = true;
            scene.add(path);

            for (let i = -140; i < 140; i += 12) {
                createTree(-10, i);
                createTree(10, i);
                if (Math.random() > 0.5) {
                    createTree(-18, i + 4);
                    createTree(18, i + 4);
                }
            }
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.6, 0.9, 6, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2d1e15, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 3;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f2615, roughness: 0.8 });
            for (let i = 0; i < 3; i++) {
                const radius = 3.5 - i * 0.8;
                const height = 3;
                const leavesGeo = new THREE.ConeGeometry(radius, height, 5);
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 5.5 + i * 1.8;
                leaves.castShadow = true;
                treeGroup.add(leaves);
            }

            const finalX = x + (Math.random() - 0.5) * 3;
            const finalZ = z + (Math.random() - 0.5) * 3;
            treeGroup.position.set(finalX, 0, finalZ);
            scene.add(treeGroup);

            trees.push({
                x: finalX,
                z: finalZ,
                radius: 1.1
            });
        }

        function createRain() {
            const rainCount = 7000;
            const rainLinesGeo = new THREE.BufferGeometry();
            const linePositions = [];

            for (let i = 0; i < rainCount; i++) {
                const x = (Math.random() - 0.5) * 120;
                const y = Math.random() * 50;
                const z = (Math.random() - 0.5) * 120;
                linePositions.push(x, y, z);
                linePositions.push(x - 0.1, y + 1.0, z - 0.1); 
            }
            rainLinesGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            
            const material = new THREE.LineBasicMaterial({
                color: 0x6688aa,
                transparent: true,
                opacity: 0.4,
                linewidth: 1
            });

            rainMesh = new THREE.LineSegments(rainLinesGeo, material);
            scene.add(rainMesh);
        }

        function updateRain() {
            const positions = rainMesh.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 6) {
                positions[i + 1] -= 1.5;     
                positions[i + 4] -= 1.5;
                positions[i] += 0.03;        
                positions[i + 3] += 0.03;

                if (positions[i + 1] < 0) {
                    const camX = yawObject.position.x;
                    const camZ = yawObject.position.z;
                    positions[i] = camX + (Math.random() - 0.5) * 100;
                    positions[i + 1] = 40 + Math.random() * 10;
                    positions[i + 2] = camZ + (Math.random() - 0.5) * 100;
                    positions[i + 3] = positions[i] - 0.1;
                    positions[i + 4] = positions[i + 1] + 1.0;
                    positions[i + 5] = positions[i + 2] - 0.1;
                }
            }
            rainMesh.geometry.attributes.position.needsUpdate = true;
        }

        function setupControls() {
            document.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                const instructions = document.getElementById('instructions');
                if (document.pointerLockElement === document.body) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = '';
                    instructions.innerHTML = 'Игра на паузе.<br>Нажмите, чтобы продолжить.';
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === document.body) {
                    const movementX = event.movementX || event.mozMovementX || event.webKitMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || event.webKitMovementY || 0;

                    const sens = 0.002;
                    yawObject.rotation.y -= movementX * sens;
                    pitchObject.rotation.x -= movementY * sens;
                    pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));
                }
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'ShiftLeft': case 'ShiftRight': isRunning = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': case 'ShiftRight': isRunning = false; break;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body) {
                // Уменьшенная скорость: ходьба 2.5, бег 4.5
                const speed = isRunning ? 4.5 : 2.5;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveBackward) - Number(moveForward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); 

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta * 10;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta * 10;

                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                
                const moveX = cameraDirection.x * velocity.z + cameraDirection.z * velocity.x;
                const moveZ = cameraDirection.z * velocity.z - cameraDirection.x * velocity.x;

                const newX = yawObject.position.x + moveX * delta;
                const newZ = yawObject.position.z + moveZ * delta;

                const playerRadius = 0.4;
                let canMoveX = true;
                let canMoveZ = true;

                for (let i = 0; i < trees.length; i++) {
                    const tree = trees[i];
                    
                    const distX = Math.abs(newX - tree.x);
                    const distZ = Math.abs(yawObject.position.z - tree.z);
                    if (distX < (tree.radius + playerRadius) && distZ < (tree.radius + playerRadius)) {
                        canMoveX = false;
                    }

                    const distX2 = Math.abs(yawObject.position.x - tree.x);
                    const distZ2 = Math.abs(newZ - tree.z);
                    if (distX2 < (tree.radius + playerRadius) && distZ2 < (tree.radius + playerRadius)) {
                        canMoveZ = false;
                    }
                }

                if (canMoveX) {
                    yawObject.position.x = newX;
                }
                if (canMoveZ) {
                    yawObject.position.z = newZ;
                }

                yawObject.position.x = Math.max(-15, Math.min(15, yawObject.position.x));
                yawObject.position.z = Math.max(-145, Math.min(145, yawObject.position.z));

                const isMoving = moveForward || moveBackward || moveLeft || moveRight;
                if (isMoving) {
                    const freq = isRunning ? 16 : 10;
                    const ampVert = isRunning ? 0.12 : 0.06;
                    walkTimer += delta * freq;
                    camera.position.y = cameraOriginalY + Math.sin(walkTimer) * ampVert;
                } else {
                    camera.position.y += (cameraOriginalY - camera.position.y) * 0.1;
                    walkTimer = 0;
                }
            }

            updateRain();
            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
